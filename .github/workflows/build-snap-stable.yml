name: Build SchedPlus Standard Snap (Stable)

on:
  push:
    tags:
      - release-*
  workflow_dispatch:

jobs:
  build:
    name: Build Stable Snap
    runs-on: ubuntu-24.04
    env:
      SNAP_CHANNEL: stable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set Snap version from project metadata
        run: python3 scripts/sync_release_versions.py
      - name: Embed externally managed package identity
        run: |
          VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          echo "SCHEDPLUS_PROJECT_VERSION=$VERSION" >> "$GITHUB_ENV"
          PYTHONPATH=src python3 scripts/update_release_metadata.py build-info \
            --destination src/schedplus/build-info.json \
            --version "$VERSION" --edition standard --platform linux \
            --architecture x86_64 --format snap
      - name: Build committed Snapcraft project
        uses: snapcore/action-build@v1
        id: snapcraft
      - name: Inspect package metadata and desktop integration
        run: |
          unsquashfs -cat "${{ steps.snapcraft.outputs.snap }}" meta/snap.yaml > /tmp/schedplus-snap.yaml
          grep -F 'name: schedplus' /tmp/schedplus-snap.yaml
          grep -F 'confinement: strict' /tmp/schedplus-snap.yaml
          grep -F "version: $SCHEDPLUS_PROJECT_VERSION" /tmp/schedplus-snap.yaml
          unsquashfs -cat "${{ steps.snapcraft.outputs.snap }}" meta/gui/schedplus.desktop | grep -F 'Exec=schedplus'
          unsquashfs -cat "${{ steps.snapcraft.outputs.snap }}" meta/gui/schedplus.desktop | grep -F 'Icon=${SNAP}/meta/gui/schedplus.png'
          unsquashfs -ll "${{ steps.snapcraft.outputs.snap }}" | grep -F 'meta/gui/schedplus.png'
      - name: Verify embedded update policy is externally managed
        run: |
          SNAP="${{ steps.snapcraft.outputs.snap }}"
          INFO_PATH="$(unsquashfs -ll "$SNAP" | grep -o '[^ ]*schedplus/build-info\.json' | head -n1 | sed -e 's|^squashfs-root/||')"
          test -n "$INFO_PATH"
          unsquashfs -cat "$SNAP" "$INFO_PATH" > /tmp/snap-build-info.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os
          info = json.loads(Path("/tmp/snap-build-info.json").read_text(encoding="utf-8"))
          assert info["format"] == "snap", info
          assert info["updates_enabled"] is False, info
          assert info["update_manifest_url"] == "", info
          expected = os.environ["SCHEDPLUS_PROJECT_VERSION"]
          assert info["version"] == expected, (info["version"], expected)
          print(f"Snap update policy verified: v{info['version']} format=snap updates externally managed")
          PY
      - name: Publish to Snapcraft stable channel
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release-')
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          snapcraft upload --release=stable "${{ steps.snapcraft.outputs.snap }}"
      - uses: actions/upload-artifact@v7
        with:
          name: schedplus-standard-snap-stable
          path: ${{ steps.snapcraft.outputs.snap }}
