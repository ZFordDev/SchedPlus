name: Assemble verified SchedPlus release

on:
  push:
    tags:
      - release-*
      - pre-release-*

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set derived package versions from project metadata
        run: python scripts/sync_release_versions.py
      - name: Require tag and project version to match
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          case "$TAG" in
            "release-$VERSION"|"pre-release-$VERSION") ;;
            *) echo "Tag $TAG does not match project version $VERSION" >&2; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Run complete test suite before packaging
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          QT_QPA_PLATFORM=offscreen python -m pytest -q
      - name: Validate shared release metadata
        run: python scripts/validate_release_metadata.py

  appimage:
    needs: validate
    uses: ./.github/workflows/build-appimage.yml
    secrets: inherit

  debian:
    needs: validate
    uses: ./.github/workflows/build-deb.yml
    secrets: inherit

  windows:
    needs: validate
    uses: ./.github/workflows/build-windows-packages.yml
    secrets: inherit

  snap:
    needs: validate
    uses: ./.github/workflows/build-snap.yml

  draft-release:
    needs: [validate, appimage, debian, windows, snap]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: schedplus-*
          path: release-artifacts
          merge-multiple: true
      - name: Create exact source archive
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: >-
          git archive --format=tar.gz
          --prefix="SchedPlus-$VERSION/"
          --output="release-artifacts/SchedPlus-$VERSION-source.tar.gz"
          "${{ github.sha }}"
      - name: Verify artifact names, licenses, and edition boundaries
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: python scripts/verify_release_artifacts.py --directory release-artifacts --version "$VERSION"
      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: release-artifacts/SchedPlus-${{ needs.validate.outputs.version }}-source.spdx.json
      - name: Generate and verify unified checksums
        working-directory: release-artifacts
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Generate and verify signed update manifest
        run: |
          python scripts/update_release_metadata.py manifest \
            --artifact-directory release-artifacts \
            --output "release-artifacts/$CHANNEL.json" \
            --version "$VERSION" --channel "$CHANNEL" \
            --release-base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" \
            --release-notes-url "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          python - <<'PY'
          import os
          from pathlib import Path
          from updater.manifest import parse_signed_manifest
          manifest = Path("release-artifacts", f"{os.environ['CHANNEL']}.json").read_bytes()
          parse_signed_manifest(manifest, os.environ["UPDATE_PUBLIC_KEY"])
          PY
        env:
          PYTHONPATH: src
          SCHEDPLUS_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
          VERSION: ${{ needs.validate.outputs.version }}
          CHANNEL: ${{ startsWith(github.ref_name, 'pre-release-') && 'preview' || 'stable' }}
      - name: Create draft candidate release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ startsWith(github.ref_name, 'pre-release-') }}
          generate_release_notes: true
          files: release-artifacts/*
