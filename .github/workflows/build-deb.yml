name: Build Debian packages

on:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/build-deb.yml
      - assets/**
      - packaging/**
      - scripts/build_debian_package.py
      - src/**
      - pyproject.toml
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      SCHEDPLUS_ENABLE_UPDATES: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
      SCHEDPLUS_UPDATE_CHANNEL: ${{ startsWith(github.ref_name, 'pre-release-') && 'preview' || 'stable' }}
      SCHEDPLUS_UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: standard
            frozen_directory: SchedPlusStandard
            package: schedplus
          - edition: lite
            frozen_directory: SchedPlusLite
            package: schedplus-lite
          - edition: cli
            frozen_directory: SchedPlusCli
            package: schedplus-cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes lintian
          python -m pip install --upgrade pip pyinstaller
          if [ "${{ matrix.edition }}" = cli ]; then
            python -m pip install .
          else
            python -m pip install ".[${{ matrix.edition }}]"
          fi
      - name: Build frozen edition
        run: >-
          pyinstaller --noconfirm --distpath dist --workpath build
          packaging/pyinstaller/schedplus-${{ matrix.edition }}.spec
      - name: Build Debian package
        id: package
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          python scripts/build_debian_package.py \
            --edition "${{ matrix.edition }}" \
            --frozen-dir "dist/${{ matrix.frozen_directory }}" \
            --output-dir artifacts/debian \
            --version "$VERSION"
      - name: Lint Debian package
        run: lintian --fail-on error artifacts/debian/*.deb
      - name: Verify installation, removal, and user data persistence
        run: |
          DATA_DIR="$HOME/.local/share/ZFordDev/SchedPlus"
          mkdir -p "$DATA_DIR"
          printf preserved > "$DATA_DIR/tasks.db"
          sudo dpkg --install artifacts/debian/*.deb
          dpkg-query --show "${{ matrix.package }}"
          sudo dpkg --remove "${{ matrix.package }}"
          test "$(cat "$DATA_DIR/tasks.db")" = preserved
      - uses: actions/upload-artifact@v4
        with:
          name: schedplus-${{ matrix.edition }}-debian
          path: artifacts/debian/*.deb
