name: Build SchedPlus Standard AppImage

on:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/build-appimage.yml
      - assets/**
      - packaging/appimage/**
      - packaging/metadata/**
      - packaging/pyinstaller/**
      - scripts/build_appimage.py
      - src/**
      - pyproject.toml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      SCHEDPLUS_ENABLE_UPDATES: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
      SCHEDPLUS_UPDATE_CHANNEL: ${{ startsWith(github.ref_name, 'pre-release-') && 'preview' || 'stable' }}
      SCHEDPLUS_UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream libegl1 libgl1 libfuse2 squashfs-tools
          python -m pip install --upgrade pip pyinstaller
          python -m pip install ".[standard]"
      - name: Build frozen Standard edition
        run: >-
          pyinstaller --noconfirm --distpath dist --workpath build
          packaging/pyinstaller/schedplus-standard.spec
      - name: Restore pinned appimagetool
        id: appimagetool-cache
        uses: actions/cache@v4
        with:
          path: appimagetool-x86_64.AppImage
          key: appimagetool-1.9.1-x86_64
      - name: Download pinned appimagetool
        if: steps.appimagetool-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            rm -f appimagetool-x86_64.AppImage
            if gh release download 1.9.1 \
              --repo AppImage/appimagetool \
              --pattern appimagetool-x86_64.AppImage \
              --output appimagetool-x86_64.AppImage; then
              break
            fi
            echo "appimagetool download attempt $attempt failed" >&2
            sleep 10
          done
      - name: Validate appimagetool
        run: |
          test -s appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
      - name: Build AppImage and checksum
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          python scripts/build_appimage.py \
            --frozen-dir dist/SchedPlusStandard \
            --output-dir artifacts/appimage \
            --version "$VERSION" \
            --appimagetool ./appimagetool-x86_64.AppImage
      - name: Smoke-test extraction fallback
        run: |
          APPIMAGE="$(find artifacts/appimage -name '*.AppImage' -print -quit)"
          "$APPIMAGE" --appimage-extract
          test -x squashfs-root/AppRun
          test -f squashfs-root/dev.zford.SchedPlus.desktop
          test -f squashfs-root/dev.zford.SchedPlus.png
          test -f squashfs-root/usr/share/metainfo/dev.zford.SchedPlus.metainfo.xml
      - name: Smoke-test portable launch without a host display server
        run: |
          APPIMAGE="$(find artifacts/appimage -name '*.AppImage' -print -quit)"
          QT_QPA_PLATFORM=offscreen "$APPIMAGE" &
          APP_PID=$!
          sleep 4
          kill -0 "$APP_PID"
          kill "$APP_PID" || true
      - name: Verify checksum
        run: (cd artifacts/appimage && sha256sum --check *.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: schedplus-standard-appimage
          path: artifacts/appimage/*
