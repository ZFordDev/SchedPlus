name: Build SchedPlus Standard AppImage

on:
  pull_request:
    paths:
      - .github/workflows/build-appimage.yml
      - assets/**
      - packaging/appimage/**
      - packaging/metadata/**
      - packaging/pyinstaller/**
      - scripts/build_appimage.py
      - src/**
      - pyproject.toml
  push:
    tags:
      - release-*
      - pre-release-*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2 squashfs-tools xvfb
          python -m pip install --upgrade pip pyinstaller
          python -m pip install ".[standard]"
      - name: Build frozen Standard edition
        run: >-
          pyinstaller --noconfirm --distpath dist --workpath build
          packaging/pyinstaller/schedplus-standard.spec
      - name: Download appimagetool
        run: |
          curl --fail --location --retry 3 \
            --output appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
      - name: Build AppImage and checksum
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          python scripts/build_appimage.py \
            --frozen-dir dist/SchedPlusStandard \
            --output-dir artifacts/appimage \
            --version "$VERSION" \
            --appimagetool ./appimagetool-x86_64.AppImage
      - name: Smoke-test extraction fallback
        run: |
          APPIMAGE="$(find artifacts/appimage -name '*.AppImage' -print -quit)"
          "$APPIMAGE" --appimage-extract
          test -x squashfs-root/AppRun
          test -f squashfs-root/dev.zford.SchedPlus.desktop
          test -f squashfs-root/dev.zford.SchedPlus.png
      - name: Smoke-test portable launch
        run: |
          APPIMAGE="$(find artifacts/appimage -name '*.AppImage' -print -quit)"
          Xvfb :99 -screen 0 1280x720x24 &
          XVFB_PID=$!
          DISPLAY=:99 "$APPIMAGE" &
          APP_PID=$!
          sleep 4
          kill -0 "$APP_PID"
          kill "$APP_PID" || true
          kill "$XVFB_PID" || true
      - name: Verify checksum
        run: (cd artifacts/appimage && sha256sum --check *.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: schedplus-standard-appimage
          path: artifacts/appimage/*
