name: Build and publish SchedPlus Standard Snap

on:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/build-snap.yml
      - snap/**
      - packaging/snap/**
      - pyproject.toml
      - src/**
      - tests/test_snap_packaging.py
  workflow_dispatch:
    inputs:
      publish_stable:
        description: Publish this revision to the stable channel
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set Snap version from project metadata
        run: python3 scripts/sync_release_versions.py
      - name: Build committed Snapcraft project
        uses: snapcore/action-build@v1
        id: snapcraft
      - name: Inspect package metadata and desktop integration
        run: |
          unsquashfs -cat "${{ steps.snapcraft.outputs.snap }}" meta/snap.yaml > /tmp/schedplus-snap.yaml
          grep -F 'name: schedplus' /tmp/schedplus-snap.yaml
          grep -F 'confinement: strict' /tmp/schedplus-snap.yaml
          unsquashfs -cat "${{ steps.snapcraft.outputs.snap }}" meta/gui/schedplus.desktop | grep -F 'Exec=schedplus'
          unsquashfs -cat "${{ steps.snapcraft.outputs.snap }}" meta/gui/schedplus.desktop | grep -F 'Icon=${SNAP}/meta/gui/schedplus.png'
          unsquashfs -ll "${{ steps.snapcraft.outputs.snap }}" | grep -F 'meta/gui/schedplus.png'
      - name: Install and launch on a clean supported runner
        run: |
          sudo snap install --dangerous "${{ steps.snapcraft.outputs.snap }}"
          QT_QPA_PLATFORM=offscreen snap run schedplus &
          APP_PID=$!
          sleep 8
          kill -0 "$APP_PID"
          kill "$APP_PID" || true
          test -f "$HOME/snap/schedplus/common/SchedPlus/tasks.db"
      - name: Verify refresh-safe task storage
        run: |
          DATABASE="$HOME/snap/schedplus/common/SchedPlus/tasks.db"
          DATABASE_HASH="$(sha256sum "$DATABASE" | cut -d ' ' -f 1)"
          sudo snap refresh --dangerous "${{ steps.snapcraft.outputs.snap }}"
          test "$(sha256sum "$DATABASE" | cut -d ' ' -f 1)" = "$DATABASE_HASH"
      - uses: actions/upload-artifact@v4
        with:
          name: schedplus-standard-snap
          path: ${{ steps.snapcraft.outputs.snap }}

  publish-prerelease:
    if: github.event_name != 'workflow_call' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: schedplus-standard-snap
          path: artifacts/snap
      - name: Locate downloaded Snap
        id: snap
        run: echo "path=$(find artifacts/snap -name '*.snap' -print -quit)" >> "$GITHUB_OUTPUT"
      - name: Select edge or candidate channel
        id: channel
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == release-* || "$TAG" == *-rc || "$TAG" == *-rc.* || "$TAG" == *-rc-* ]]; then
            echo 'name=candidate' >> "$GITHUB_OUTPUT"
          else
            echo 'name=edge' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish tagged build
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: ${{ steps.channel.outputs.name }}

  publish-stable:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_stable
    needs: build
    runs-on: ubuntu-24.04
    environment: snap-store-stable
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: schedplus-standard-snap
          path: artifacts/snap
      - name: Locate downloaded Snap
        id: snap
        run: echo "path=$(find artifacts/snap -name '*.snap' -print -quit)" >> "$GITHUB_OUTPUT"
      - name: Publish manually approved stable build
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: stable
