name: Build and Publish Snap Package

on:
  push:
    tags:
      - 'release-*'
      - 'pre-release-*'

jobs:
  package-snap:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Extract absolute version
        id: get_version
        run: |
          VERSION=$(python3 -c "
          for line in open('pyproject.toml'):
              if line.strip().startswith('version ='):
                  print(line.split('=')[1].strip().strip('\"\''))
                  break
          ")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version for Snap: $VERSION"

      - name: Dynamically Generate Snapcraft Manifest
        run: |
          mkdir -p snap
          cat <<EOF > snap/snapcraft.yaml
          name: schedplus
          base: core24
          version: '${{ env.VERSION }}'
          summary: A modern, local-first scheduler for tasks and time.
          description: |
            SchedPlus is a modern, local-first scheduler for planning tasks and
            time without an account or network connection. It includes native
            desktop workspaces, a calendar, SQLite persistence, and a CLI.
          grade: stable
          confinement: strict
          apps:
            schedplus:
              command: bin/schedplus-full
              extensions: [gnome]
              plugs:
                - home
                - network
            
          parts:
            schedplus:
              plugin: python
              source: .
              python-packages:
                - .
              build-packages:
                - build-essential
                - python3-dev
              stage-packages:
                - libgl1-mesa-glx
          EOF
          echo "snapcraft.yaml generated successfully."

      - name: Build Snap Package
        uses: snapcore/action-build@v1
        id: snapcraft

      - name: Determine Track and Release Status
        id: check_type
        run: |
          if [[ "${{ github.ref_name }}" == pre-release-* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "SNAP_CHANNEL=edge" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "SNAP_CHANNEL=candidate" >> $GITHUB_ENV
          fi

      - name: Upload Package to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.snapcraft.outputs.snap }}
          prerelease: ${{ env.IS_PRERELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Direct to Canonical Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: ${{ env.SNAP_CHANNEL }}
