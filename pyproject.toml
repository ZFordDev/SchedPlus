[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schedplus"
version = "0.7.3"
description = "Modern, local-first scheduling and productivity application"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"

authors = [
  { name = "ZFordDev", email = "zforddev@gmail.com" }
]

maintainers = [
  { name = "ZFordDev", email = "zforddev@gmail.com" }
]

keywords = ["schedule", "tasks", "calendar", "productivity", "UI"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Scheduling"
]

dependencies = [
  "cryptography>=44.0.0"
]

[project.optional-dependencies]
lite = [
  "tkcalendar>=1.6.1"
]
standard = [
  "PyQt6>=6.11.0"
]
full = [
  "PyQt6>=6.11.0",
  "tkcalendar>=1.6.1"
]
dev = [
  "PyQt6>=6.11.0",
  "tkcalendar>=1.6.1",
  "pytest",
  "black",
  "ruff",
  "tomli>=2.0.0; python_version < '3.11'"
]

[project.urls]
Homepage = "https://github.com/ZFordDev/schedplus"
Documentation = "https://docs.zford.dev/zforddev/schedplus"
Repository = "https://github.com/ZFordDev/schedplus.git"
"Bug Tracker" = "https://github.com/ZFordDev/schedplus/issues"
Changelog = "https://github.com/ZFordDev/schedplus/blob/main/CHANGELOG.md"

[project.scripts]
# ``schedplus`` remains the flexible Full launcher for source installs.
schedplus = "startup.controller:boot_full"
schedplus-full = "startup.controller:boot_full"
schedplus-standard = "startup.controller:boot_standard"
schedplus-lite = "startup.controller:boot_lite"
schedplus-cli = "startup.controller:boot_cli"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE", "LICENSES/*", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["schedplus*", "cli*", "logic*", "startup*", "ui*", "data*", "updater*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
