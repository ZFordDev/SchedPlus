<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the active task -->
    <linearGradient id="taskGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#63E6BE" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop shadow for the panel -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="#0F0F0F"/>

  <!-- Inner panel with shadow -->
  <rect x="16" y="20" width="96" height="92" rx="14" fill="#1A1A1A" stroke="#2D2D2D" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Calendar grid -->
  <g stroke="#2A2A2A" stroke-width="1.5" stroke-linecap="round">
    <line x1="24" y1="48" x2="104" y2="48"/>
    <line x1="24" y1="72" x2="104" y2="72"/>
    <line x1="24" y1="96" x2="104" y2="96"/>
    <line x1="48" y1="36" x2="48" y2="108"/>
    <line x1="80" y1="36" x2="80" y2="108"/>
  </g>

  <!-- Highlighted task block with Gradient and Glow -->
  <rect x="76" y="68" width="24" height="24" rx="7" fill="url(#taskGradient)" filter="url(#glow)" />

  <!-- Top Accent Bar (The "Pop") -->
  <path d="M16 34 C 16 26.268 22.268 20 30 20 H 98 C 105.732 20 112 26.268 112 34 V 38 H 16 V 34 Z" fill="#FF4B4B" />
  
  <!-- Subtle glass shine on the header -->
  <rect x="16" y="20" width="96" height="4" rx="2" fill="white" fill-opacity="0.15"/>
</svg>
